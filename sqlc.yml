version: "2"
sql:
  - engine: "postgresql"
    schema: "./db/migrations"
    queries: "./db/queries"
    gen:
      go:
        package: "db"
        out: "cmd/ports/db"
        sql_package: "pgx/v5"
overrides:
  go:
    rename:
      summoner: SummonerRow
      guild: GuildRow
      guild_summoner: GuildSummonerRow
